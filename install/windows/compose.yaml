services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agro_teste
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Senha local obrigatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U agro -d agro_teste']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Chave local obrigatoria}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_DB: agro_teste
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/media
    command: sh -c 'cd /app/backend && python manage.py runserver 0.0.0.0:8000 --noreload'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:${APP_PORT:-5183}:80'
    healthcheck:
      test: [CMD, wget, -q, -O, '-', http://127.0.0.1/]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  uploads:
