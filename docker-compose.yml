services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agro_ai_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT_EXPOSED:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agro_ai_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT_EXPOSED:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me-at-least-32-characters}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-agro_ai_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CLIMA_PROVIDER_BASE_URL: ${CLIMA_PROVIDER_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      CLIMA_PROVIDER_TIMEOUT_SECONDS: ${CLIMA_PROVIDER_TIMEOUT_SECONDS:-15}
      CLIMA_PROVIDER_CACHE_SECONDS: ${CLIMA_PROVIDER_CACHE_SECONDS:-900}
      CLIMA_UPDATE_LOCK_SECONDS: ${CLIMA_UPDATE_LOCK_SECONDS:-180}
      CLIMA_UPDATE_INTERVAL_SECONDS: ${CLIMA_UPDATE_INTERVAL_SECONDS:-300}
      CLIMA_MAX_UPDATES_PER_CYCLE: ${CLIMA_MAX_UPDATES_PER_CYCLE:-100}
      CLIMA_AUTOMATIC_UPDATE_ENABLED: ${CLIMA_AUTOMATIC_UPDATE_ENABLED:-True}
      MERCADO_PROVIDER_CACHE_SECONDS: ${MERCADO_PROVIDER_CACHE_SECONDS:-600}
      MERCADO_UPDATE_LOCK_SECONDS: ${MERCADO_UPDATE_LOCK_SECONDS:-300}
      MERCADO_UPDATE_INTERVAL_SECONDS: ${MERCADO_UPDATE_INTERVAL_SECONDS:-300}
      MERCADO_UPDATE_FREQUENCY_MINUTES: ${MERCADO_UPDATE_FREQUENCY_MINUTES:-15}
      MERCADO_MAX_UPDATES_PER_CYCLE: ${MERCADO_MAX_UPDATES_PER_CYCLE:-20}
      MERCADO_AUTOMATIC_UPDATE_ENABLED: ${MERCADO_AUTOMATIC_UPDATE_ENABLED:-True}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - .:/app
    command: sh -c "cd /app/backend && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  clima-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me-at-least-32-characters}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-agro_ai_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CLIMA_PROVIDER_BASE_URL: ${CLIMA_PROVIDER_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      CLIMA_PROVIDER_TIMEOUT_SECONDS: ${CLIMA_PROVIDER_TIMEOUT_SECONDS:-15}
      CLIMA_PROVIDER_CACHE_SECONDS: ${CLIMA_PROVIDER_CACHE_SECONDS:-900}
      CLIMA_UPDATE_LOCK_SECONDS: ${CLIMA_UPDATE_LOCK_SECONDS:-180}
      CLIMA_UPDATE_INTERVAL_SECONDS: ${CLIMA_UPDATE_INTERVAL_SECONDS:-300}
      CLIMA_MAX_UPDATES_PER_CYCLE: ${CLIMA_MAX_UPDATES_PER_CYCLE:-100}
      CLIMA_AUTOMATIC_UPDATE_ENABLED: ${CLIMA_AUTOMATIC_UPDATE_ENABLED:-True}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "cd /app/backend && python manage.py atualizar_clima --continuous --interval-seconds $${CLIMA_UPDATE_INTERVAL_SECONDS:-300}"
    restart: unless-stopped

  mercado-worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.development}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-me-at-least-32-characters}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      POSTGRES_DB: ${POSTGRES_DB:-agro_ai_pro}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      MERCADO_PROVIDER_CACHE_SECONDS: ${MERCADO_PROVIDER_CACHE_SECONDS:-600}
      MERCADO_UPDATE_LOCK_SECONDS: ${MERCADO_UPDATE_LOCK_SECONDS:-300}
      MERCADO_UPDATE_INTERVAL_SECONDS: ${MERCADO_UPDATE_INTERVAL_SECONDS:-300}
      MERCADO_UPDATE_FREQUENCY_MINUTES: ${MERCADO_UPDATE_FREQUENCY_MINUTES:-15}
      MERCADO_MAX_UPDATES_PER_CYCLE: ${MERCADO_MAX_UPDATES_PER_CYCLE:-20}
      MERCADO_AUTOMATIC_UPDATE_ENABLED: ${MERCADO_AUTOMATIC_UPDATE_ENABLED:-True}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: sh -c "cd /app/backend && python manage.py atualizar_mercado --continuous --interval-seconds $${MERCADO_UPDATE_INTERVAL_SECONDS:-300}"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
