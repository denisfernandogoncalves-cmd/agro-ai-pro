name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-postgres:
    name: Backend PostgreSQL isolado
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agro_ci
          POSTGRES_USER: agro_ci
          POSTGRES_PASSWORD: somente-ci-isolada
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U agro_ci"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      POSTGRES_DB: agro_ci
      POSTGRES_USER: agro_ci
      POSTGRES_PASSWORD: somente-ci-isolada
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - run: python -m pip install -r backend/requirements/dev.txt
      - run: python scripts/test_backend_isolado.py
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/dev.txt

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Verificar migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Executar testes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Compilar produção
        run: npm run build
