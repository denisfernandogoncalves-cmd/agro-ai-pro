name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/gestao-integrada-producao-consolidacao

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/dev.txt

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Verificar migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py migrate --noinput

      - name: Executar testes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          set +e
          python manage.py test > test-output.log 2>&1
          status=$?
          tail -n 180 test-output.log
          exit $status

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.log
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Compilar produção
        run: npm run build

  infraestrutura:
    name: Infraestrutura e segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Validar whitespace
        run: git diff --check HEAD^

      - name: Verificar credenciais versionadas
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16})' -- \
            ':!*.md' ':!frontend/package-lock.json'; then
            echo "Possível segredo encontrado."
            exit 1
          fi
