name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/gestao-integrada-producao

permissions:
  contents: read
  statuses: write

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements/dev.txt

      - name: Django Check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

      - name: Verificar migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py migrate --noinput

      - name: Executar testes
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          set +e
          python manage.py test > test-output.log 2>&1
          status=$?
          tail -n 220 test-output.log
          exit $status

      - name: Publicar relatório de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-output
          path: backend/test-output.log
          retention-days: 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test

      - name: Compilar produção
        run: npm run build

  infraestrutura:
    name: Infraestrutura e segurança
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Validar whitespace
        run: git diff --check HEAD^

      - name: Bloquear arquivos sensíveis
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$'; then
            echo "Arquivo de ambiente versionado indevidamente."
            exit 1
          fi
          if git ls-files | grep -Ei '\.(log|pem|key|p12|pfx)$'; then
            echo "Arquivo sensível ou log versionado indevidamente."
            exit 1
          fi

      - name: Verificar credenciais versionadas
        run: |
          if git grep -nE '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,})' -- \
            ':!*.md' ':!frontend/package-lock.json' ':!.env.example'; then
            echo "Possível segredo encontrado."
            exit 1
          fi

  resultado:
    name: Resultado agregado
    if: always()
    needs:
      - backend
      - frontend
      - infraestrutura
    runs-on: ubuntu-latest
    steps:
      - name: Publicar status do commit
        uses: actions/github-script@v7
        with:
          script: |
            const resultados = [
              '${{ needs.backend.result }}',
              '${{ needs.frontend.result }}',
              '${{ needs.infraestrutura.result }}',
            ];
            const aprovado = resultados.every((resultado) => resultado === 'success');
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: aprovado ? 'success' : 'failure',
              context: 'AGRO-AI-PRO/CI',
              description: aprovado ? 'Backend, frontend e infraestrutura aprovados' : `Falha: ${resultados.join(', ')}`,
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!aprovado) {
              core.setFailed(`Validação incompleta: ${resultados.join(', ')}`);
            }
