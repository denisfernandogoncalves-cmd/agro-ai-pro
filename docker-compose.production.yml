services:
  postgres:
    ports: !reset []
  redis:
    ports: !reset []
  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Defina uma chave forte}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Defina dominios autorizados}
      DJANGO_CACHE_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    command: sh -c "cd /app/backend && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/ready/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=4)"]
